name: Playwright Tests

# Runs the Sauce Demo UI suite in Chromium, Firefox and WebKit on every push to main and every
# pull request. The login comes from repository secrets (Settings → Secrets
# and variables → Actions): APP_EMAIL (the Sauce Demo username) and
# APP_PASSWORD. Sauce Demo publishes its demo credentials on its login page,
# but they are still kept out of the code, as the project rules require.

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            APP_URL: https://www.saucedemo.com
            APP_EMAIL: ${{ secrets.APP_EMAIL }}
            APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Write env file from workflow env
              run: |
                  mkdir -p env
                  {
                    echo "APP_URL=$APP_URL"
                    echo "APP_EMAIL=$APP_EMAIL"
                    echo "APP_PASSWORD=$APP_PASSWORD"
                  } > env/.env.dev

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium firefox webkit

            - name: Run Playwright tests
              run: npx playwright test --project=chromium --project=firefox --project=webkit --grep-invert @destructive

            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14
